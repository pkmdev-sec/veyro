name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.22"
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install frozen development environment
        run: uv sync --frozen --extra dev
      - name: Tests
        run: uv run pytest -q

  package:
    name: Package and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.22"
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install frozen development environment
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run ruff check src tests tools examples
      - name: Check generated assets
        run: |
          uv run python tools/generate_header_logo.py --check
          uv run --script tools/generate_supervision_diagram.py --check
      - name: Check public documentation
        run: uv run python tools/check_public_docs.py
      - name: Build artifacts
        run: uv build --out-dir dist
      - name: Qualify wheel and sdist
        run: >-
          uv run python tools/check_release.py
          dist/*.whl
          dist/*.tar.gz
          > dist/release-receipt.json
      - name: Smoke-test isolated wheel
        run: |
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          uv pip check --python .wheel-smoke/bin/python
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/veyro" --help
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/veyro" agents --json
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -I -c \
            'import veyro; assert veyro.__all__ == ["__version__"]'
      - name: Upload qualified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veyro-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-receipt.json
          if-no-files-found: error
