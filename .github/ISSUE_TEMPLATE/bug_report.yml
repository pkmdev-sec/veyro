name: Bug report
description: Report reproducible incorrect behavior in Veyro
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md and use private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: For an installed package, run `python -c 'import veyro; print(veyro.__version__)'`. For a source checkout, run `git rev-parse --short HEAD`.
      placeholder: 0.4.0 or abc1234
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and environment
      description: Include the exact command, operating system, Python version, provider, and provider version. Redact credentials and private paths.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the smallest sequence that reproduces the problem.
      placeholder: |
        1. Start ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include bounded output or a traceback. Remove prompts, source text, tokens, and session transcripts unless essential.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and unrelated private material. Any prompt, source text, or session transcript included is redacted and limited to what is essential to reproduce this bug.
          required: true
